<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Farmer Chatbot Voice</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;flex-direction:column}header{background:rgba(0,0,0,.3);color:white;padding:20px;text-align:center}header h1{font-size:28px}.container{flex:1;display:flex;justify-content:center;padding:20px}.chatbox{width:100%;max-width:600px;background:white;border-radius:15px;box-shadow:0 10px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;height:600px}.chat-header{background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:15px;display:flex;justify-content:space-between;align-items:center}.messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}.message{padding:10px 15px;border-radius:10px;max-width:85%;word-wrap:break-word;position:relative}.user-message{align-self:flex-end;background:#667eea;color:white}.bot-message{align-self:flex-start;background:#f0f0f0;color:#333}.voice-btn{background:none;border:none;cursor:pointer;font-size:16px;opacity:.7;transition:opacity .2s}.voice-btn:hover{opacity:1}.input-area{padding:15px;display:flex;gap:10px}.input-area input{flex:1;padding:10px 15px;border:1px solid #ddd;border-radius:25px}.input-area button{background:#667eea;color:white;border:none;padding:10px 20px;border-radius:25px;cursor:pointer}.lang-btn{padding:5px 10px;background:rgba(255,255,255,.3);color:white;border:1px solid white;border-radius:5px;cursor:pointer;margin:0 2px}.lang-btn.active{background:white;color:#667eea}.voice-toggle{background:rgba(255,255,255,.3);color:white;border:1px solid white;padding:5px 10px;border-radius:5px;cursor:pointer}footer{background:rgba(0,0,0,.3);color:white;text-align:center;padding:15px;font-size:12px}</style></head>
<body>
<header><h1>🌾 Farmer Helper Chatbot</h1><p>రైతుల సహాయక చాట్‌బాట్</p></header>
<div class="container"><div class="chatbox"><div class="chat-header"><h2>Farming Assistant</h2><div><button class="lang-btn active" onclick="setLanguage('en')">English</button> <button class="lang-btn" onclick="setLanguage('te')">తెలుగు</button> <button class="voice-toggle" onclick="toggleVoice()">🔊 Voice: ON</button></div></div>
<div class="messages" id="messages"><div class="message bot-message">👋 Hello! How can I help you with farming today? <button class="voice-btn" onclick="speak(this.parentElement.textContent.replace('\ud83d\udc4b ','')+' ')">🔊</button></div></div>
<div class="input-area"><input type="text" id="msg" placeholder="Type your question..." onkeypress="if(event.key=='Enter')send()"><button onclick="send()">Send</button> <button onclick="startVoiceInput()" style="background:#667eea;color:white;border:none;padding:10px 15px;border-radius:25px;cursor:pointer;width:50px">🎤</button></div></div></div>
<footer><p>🌱 Farmer Helper Chatbot with Voice | CSP Project</p></footer>
<script>
let lang='en',voiceOn=true;
const ans={en:{'hello':'Hello!','crop':'Many crops like rice, wheat, cotton, sugarcane are grown in India. Which crop?','water':'Water is important. Use bore wells, canal water or rainwater. Drip irrigation is efficient!','fertilizer':'Use organic fertilizers like cow dung. Also use NPK based on soil test.','pest':'Use neem spray for pest control. Consult local agricultural officer if needed.','price':'Crop prices change daily. Check local mandi or government websites.','default':'Ask about crops, water, fertilizers, pests or prices!'},te:{'నమస్కారం':'నమస్కారం!','పంట':'వరి, గోధుమ, పత్తి, చెరుకు వంటి పంటలు సాగు చేస్తారు.','నీరు':'నీరు చాలా ముఖ్యమైనది. బోర్, కాలువ నీరు వాడవచ్చు.','ఎరువు':'సేంద్రియ ఎరువులు వాడండి. NPK కూడా వాడవచ్చు.','చీమలు':'చీమలకు నీమ పిండిని వాడండి.','ధర':'ధరలు ప్రతిరోజూ మారతాయి. మండిలో చూడండి.','default':'పంటలు, నీరు, ఎరువులు, చీమలు, ధర గురించి అడగండి!'}};
function setLanguage(l){lang=l;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active')}
function toggleVoice(){voiceOn=!voiceOn;event.target.textContent=voiceOn?'🔊 Voice: ON':'🔇 Voice: OFF'}
function speak(text){if(!voiceOn)return;const utterance=new SpeechSynthesisUtterance(text);utterance.lang=lang==='te'?'te-IN':'en-IN';window.speechSynthesis.speak(utterance)}
function startVoiceInput(){const recognition=new (window.SpeechRecognition||window.webkitSpeechRecognition)();recognition.lang=lang==='te'?'te-IN':'en-IN';recognition.onresult=(e)=>{const transcript=e.results[0][0].transcript;document.getElementById('msg').value=transcript;send()};recognition.start()}
function send(){const i=document.getElementById('msg'),m=i.value.trim();if(!m)return;addMsg(m,'user');i.value='';setTimeout(()=>{let r=ans[lang]['default'];for(let k in ans[lang])if(m.toLowerCase().includes(k.toLowerCase())){r=ans[lang][k];break}addMsg(r,'bot');if(voiceOn)speak(r)},500)}
function addMsg(t,s){const d=document.getElementById('messages'),e=document.createElement('div');e.className='message '+s+'-message';if(s==='bot'){e.innerHTML=t+' <button class="voice-btn" onclick="speak(this.parentElement.textContent.replace(\"\ud83d\udd0a \",\"\"))">\ud83d\udd0a</button>'}else{e.textContent=t}d.appendChild(e);d.scrollTop=d.scrollHeight}
</script>
</body>
</html>
