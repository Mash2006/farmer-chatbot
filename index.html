<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer ChatBot AI - Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2d5016 0%, #1a3a0a 50%, #4a7c2c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }
        .header {
            background: linear-gradient(135deg, #2d5016 0%, #1a3a0a 100%);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 5px solid #ffc107;
        }
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fafaf5;
        }
        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { align-items: flex-end; }
        .message.bot { align-items: flex-start; }
        .message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.5;
        }
        .message.user .message-content { background: #2d5016; color: white; border-bottom-right-radius: 2px; }
        .message.bot .message-content { background: white; color: #333; border: 2px solid #2d5016; border-bottom-left-radius: 2px; }
        .input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }
        .input-group { flex: 1; background: #f5f5f5; border-radius: 25px; padding: 5px 15px; border: 2px solid transparent; }
        .input-group:focus-within { border-color: #2d5016; background: white; }
        .input-group input { width: 100%; border: none; background: transparent; padding: 8px; outline: none; }
        .btn-send { background: #2d5016; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .typing { font-size: 12px; color: #666; padding: 5px 20px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌾 Farmer ChatBot AI</h1>
            <p>Your 24/7 Agricultural Expert Assistant</p>
        </div>
        <div class="chat-area" id="chatArea">
            <div class="message bot">
                <div class="message-content">Hello! I am your AI Farming Assistant. I can help you diagnose crop diseases and provide treatment plans. What's happening in your farm today?</div>
            </div>
        </div>
        <div id="typingIndicator" class="typing">Assistant is thinking...</div>
        <div class="input-area">
            <div class="input-group">
                <input type="text" id="userInput" placeholder="Describe symptoms (e.g., 'yellow spots on leaves')..." autocomplete="off">
            </div>
            <button class="btn-send" id="sendBtn">➤</button>
        </div>
    </div>
    <script>
        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const diseaseDB = {
            'leaf spot': { name: 'Cercospora Leaf Spot', cause: 'Fungal infection', symptoms: 'Small circular spots with gray centers.', solution: 'Apply Copper fungicide.', organic: 'Neem oil spray.' },
            'yellow': { name: 'Nutrient Deficiency', cause: 'Lack of Nitrogen', symptoms: 'Yellowing of older leaves.', solution: 'Apply Urea fertilizer.', organic: 'Compost tea.' },
            'blast': { name: 'Rice Blast', cause: 'Fungus Magnaporthe', symptoms: 'Spindle-shaped spots on leaves.', solution: 'Apply Tricyclazole.', organic: 'Pseudomonas bio-control.' },
            'pests': { name: 'General Pest Attack', cause: 'Sap-sucking insects', symptoms: 'Curled leaves or sticky residue.', solution: 'Apply Imidacloprid.', organic: 'Insecticidal soap.' }
        };
        function addMessage(text, isUser) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            msgDiv.innerHTML = `<div class="message-content">${text}</div>`;
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        function getReply(input) {
            const text = input.toLowerCase();
            for (let key in diseaseDB) {
                if (text.includes(key)) {
                    const d = diseaseDB[key];
                    return `<b>Diagnosis: ${d.name}</b><br><br>Cause: ${d.cause}<br>Symptoms: ${d.symptoms}<br><br><b>Treatment:</b> ${d.solution}<br><b>Organic:</b> ${d.organic}`;
                }
            }
            if (text.includes('hi') || text.includes('hello')) return "Hello! How can I help you with your crops today?";
            if (text.includes('help')) return "You can tell me about plant symptoms like 'yellow leaves', 'brown spots', or ask for 'growth tips'.";
            return `I understand you're asking about "${input}". To give you the best advice, could you specify if you see spots, yellowing, or pests?`;
        }
        function handleSend() {
            const val = userInput.value.trim();
            if (!val) return;
            addMessage(val, true);
            userInput.value = '';
            typingIndicator.style.display = 'block';
            setTimeout(() => {
                typingIndicator.style.display = 'none';
                addMessage(getReply(val), false);
            }, 800);
        }
        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });
    </script>
</body>
</html>
