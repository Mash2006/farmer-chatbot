<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farmer Assistant</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(180deg,#1b4d2e 0%,#2d5a3d 50%,#8b9d6f 100%);min-height:100vh;display:flex;flex-direction:column}header{background:linear-gradient(135deg,#1b4d2e,#2d5a3d);color:white;padding:25px;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,0.4)}header h1{font-size:36px;display:flex;align-items:center;justify-content:center;gap:12px}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}.farmer{font-size:40px;animation:bounce 2s infinite}.container{flex:1;display:flex;justify-content:center;padding:20px}.chatbox{width:100%;max-width:700px;background:white;border-radius:20px;box-shadow:0 15px 50px rgba(0,0,0,0.4);display:flex;flex-direction:column;height:680px;border:4px solid #8b9d6f}.header{background:linear-gradient(135deg,#1b4d2e,#2d5a3d);color:white;padding:18px;display:flex;justify-content:space-between;align-items:center}.header h2{font-size:22px}.btns{display:flex;gap:8px}.btn{padding:8px 14px;background:rgba(255,255,255,0.2);color:white;border:2px solid white;border-radius:6px;cursor:pointer;font-weight:bold;transition:all 0.3s}.btn.active{background:white;color:#1b4d2e;border-color:#1b4d2e}.btn:hover{background:rgba(255,255,255,0.4)}.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,#f9fbf6,#eff2ec)}.msg{padding:12px 16px;border-radius:12px;max-width:80%;word-wrap:break-word;animation:slideIn 0.3s ease}.user{align-self:flex-end;background:linear-gradient(135deg,#1b4d2e,#2d5a3d);color:white;border-radius:12px 2px 12px 12px}.bot{align-self:flex-start;background:linear-gradient(135deg,#e8f5e1,#d4f0c5);color:#333;border:2px solid #8b9d6f;border-radius:2px 12px 12px 12px}@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.voice-btn{background:none;border:none;cursor:pointer;font-size:14px;opacity:0.6;margin-left:8px;animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:0.6}50%{opacity:1}}.input{padding:14px;border-top:2px solid #d4af37;display:flex;gap:10px;background:white}.input input{flex:1;padding:11px 14px;border:2px solid #8b9d6f;border-radius:20px;outline:none;transition:all 0.3s}.input input:focus{border-color:#1b4d2e;box-shadow:0 0 8px rgba(27,77,46,0.2)}.input button{background:linear-gradient(135deg,#1b4d2e,#2d5a3d);color:white;border:none;padding:11px 22px;border-radius:20px;cursor:pointer;font-weight:bold;transition:all 0.3s}.input button:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(27,77,46,0.3)}.mic{width:45px;padding:11px 8px !important;background:linear-gradient(135deg,#228b22,#1a6b1a) !important}footer{background:linear-gradient(135deg,#1b4d2e,#2d5a3d);color:#d4af37;text-align:center;padding:14px;font-size:11px;border-top:3px solid #8b9d6f;font-weight:bold}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#8b9d6f;border-radius:3px}</style></head><body><header><h1><span class="farmer">🌾👨‍🌾🌾</span>Farmer Assistant Bot</h1><p>Your Smart Agricultural Expert | 24/7 Farming Support</p></header><div class="container"><div class="chatbox"><div class="header"><h2>🌱 Farming Expert</h2><div class="btns"><button class="btn active" onclick="setLang('en')">English</button> <button class="btn" onclick="setLang('te')">Telugu</button> <button class="btn" onclick="toggleVoice()">🔊 Voice</button></div></div><div class="msgs" id="m"><div class="msg bot">👋 नमस्कार! Welcome Farmer! Ask me about crops, water, fertilizers, pests & prices. I'm here 24/7! 🌾 <button class="voice-btn" onclick="speak('Welcome Farmer')">🔊</button></div></div><div class="input"><input type="text" id="i" placeholder="Ask about farming..." onkeypress="if(event.key=='Enter')send()"><button onclick="send()">Send</button> <button class="mic" onclick="voice()">🎤</button></div></div></div><footer>🌾 Farmer Bot | AI Helper | Free Service</footer><script>let l='en',v=true,a={en:{'hello':'Hello Farmer!','crop':'Rice, wheat, cotton, maize, pulses - which crop?','water':'Use drip irrigation to save 60% water!','fertilizer':'Organic fertilizers: cow dung, compost, vermicompost!','pest':'Neem spray is best for pest control!','price':'Check mandi prices for market rates!','soil':'Soil testing yearly keeps your farm healthy!','default':'Ask about crops, water, fertilizers, pests or prices!'},te:{'hello':'హలో రైతుగారూ!','crop':'వరి, గోధుమ, పత్తి, మక్కజొన్న, కంది - ఏ పంట?','water':'చిక్కుళ్ళ నీటిపారుదల 60% నీటిని ఆదా చేస్తుంది!','fertilizer':'సేంద్రియ ఎరువులు: ఆవు సరుకు, కంపోస్ట్!','pest':'చీమలకు నీమ స్ప్రే సెరైనవి!','price':'మండిలో ధరలు చూడండి!','soil':'సంవత్సరానికి మట్టి పరీక్ష చేయండి!','default':'పంటలు, నీరు, ఎరువులు, చీమలు గురించి అడగండి!'}};function setLang(x){l=x;document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active')}function toggleVoice(){v=!v;event.target.textContent=v?'🔊 Voice':'🔇 Mute'}function speak(t){if(!v)return;const u=new SpeechSynthesisUtterance(t);u.lang=l==='te'?'te-IN':'en-IN';window.speechSynthesis.speak(u)}function voice(){const r=new (window.SpeechRecognition||window.webkitSpeechRecognition)();r.lang=l==='te'?'te-IN':'en-IN';r.onresult=e=>{document.getElementById('i').value=e.results[0][0].transcript;send()};r.start()}function send(){const i=document.getElementById('i'),t=i.value.trim();if(!t)return;add(t,'user');i.value='';setTimeout(()=>{let r=a[l]['default'];for(let k in a[l])if(t.toLowerCase().includes(k.toLowerCase())){r=a[l][k];break}add(r,'bot');speak(r)},500)}function add(t,s){const d=document.getElementById('m'),e=document.createElement('div');e.className='msg '+s;if(s==='bot'){e.innerHTML=t+' <button class="voice-btn" onclick="speak(\''+t.replace(/'/g,"\\'")+'\')" >🔊</button>'}else{e.textContent=t}d.appendChild(e);d.scrollTop=d.scrollHeight}</script></body></html>
